name: Build Modpack

on:
  push:
    branches:
      - **

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go & Install packwiz
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false # Optional: speeds up builds if run frequently

      - name: Build Modpack
        id: build_pack
        run: |
          # Install packwiz
          go install github.com/packwiz/packwiz@latest

          # Read, clean, and format the modpack name from pack.toml
          RAW_NAME=$(yq '.name' pack.toml)
          CLEAN_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\{2,\}/-/g')
          echo "pack_name=${CLEAN_NAME}" >> $GITHUB_OUTPUT

          # Export to .mrpack
          ~/go/bin/packwiz mr export --output "${CLEAN_NAME}.mrpack"

      - name: Upload Modpack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_pack.outputs.pack_name }}-mrpack
          path: ${{ steps.build_pack.outputs.pack_name }}.mrpack
