name: Build Modpack & Deploy Website

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get modpack info
        id: info
        run: |
          VERSION=$(yq '.version' pack.toml | tr -d '"')
          NAME=$(yq '.name' pack.toml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "artifact_name=${NAME}-build" >> $GITHUB_OUTPUT

      - name: Build modpack files
        run: |
          go install github.com/packwiz/packwiz@latest

          ~/go/bin/packwiz mr export --output "${{ steps.info.outputs.name }}.mrpack"
          ~/go/bin/packwiz curseforge export --output "${{ steps.info.outputs.name }}-curseforge-client.zip"
          ~/go/bin/packwiz curseforge export --side server --output "${{ steps.info.outputs.name }}-curseforge-server.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.artifact_name }}
          path: |
            *.mrpack
            *-curseforge-*.zip
            pack.toml
            index.toml
          retention-days: 90

    outputs:
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      artifact_name: ${{ steps.info.outputs.artifact_name }}
      run_id: ${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create website
        run: |
          NAME="${{ needs.build.outputs.name }}"
          RUN_ID="${{ needs.build.outputs.run_id }}"
          REPO="ElectricDaFearox/Origins-TavernModpack"

          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{{NAME}} - Modpack</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                max-width: 1000px;
                margin: 40px auto;
                padding: 40px 20px;
                background: #0d1117;
                color: #ddd;
                line-height: 1.6;
              }
              h1 { color: #58a6ff; }
              .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 12px;
                padding: 28px;
                margin: 24px 0;
              }
              .btn {
                background: #238636;
                color: white;
                padding: 16px 32px;
                border-radius: 8px;
                text-decoration: none;
                font-weight: bold;
                display: inline-block;
                margin: 12px 8px 12px 0;
                transition: all 0.2s;
              }
              .btn:hover { background: #2ea44f; transform: translateY(-2px); }
              .btn-recommended {
                background: #3b82f6;
                font-size: 1.15em;
              }
              .btn-recommended:hover { background: #60a5fa; }
              .note { color: #8b949e; font-size: 0.95em; }
              .badge {
                display: inline-block;
                background: #238636;
                color: white;
                font-size: 0.8em;
                padding: 4px 12px;
                border-radius: 9999px;
                margin-left: 12px;
              }
              .server-tag {
                background: #f59e0b;
                color: #000;
                font-size: 0.85em;
                padding: 3px 10px;
                border-radius: 9999px;
              }
              .warning {
                color: #f59e0b;
                font-size: 0.9em;
                margin-top: 8px;
              }
            </style>
          </head>
          <body>
            <h1>{{NAME}}</h1>
            <p class="note">Version {{VERSION}} • Updated {{DATE}}</p>

            <div class="card">
              <h2>Recommended — .mrpack <span class="badge">RECOMMENDED</span></h2>
              <p class="note">Best for <strong>Prism Launcher</strong>, <strong>Modrinth App</strong>, and most users.<br>Supports automatic updates.</p>
              <a href="https://nightly.link/${REPO}/workflows/Build%20Modpack%20&%20Deploy%20Website/${RUN_ID}/${NAME}-build/${NAME}.mrpack"
                 class="btn btn-recommended" target="_blank">↓ Download {{NAME}}.mrpack</a>
            </div>

            <div class="card">
              <h2>CurseForge Client</h2>
              <p class="note">For CurseForge Launcher (Client).</p>
              <a href="https://nightly.link/${REPO}/workflows/Build%20Modpack%20&%20Deploy%20Website/${RUN_ID}/${NAME}-build/${NAME}-curseforge-client.zip"
                 class="btn" target="_blank">↓ Download {{NAME}}-curseforge-client.zip</a>
            </div>

            <div class="card">
              <h2>CurseForge Server <span class="server-tag">SERVER</span></h2>
              <p class="note">For CurseForge Launcher (Server). Also useful for manual server setup.</p>
              <a href="https://nightly.link/${REPO}/workflows/Build%20Modpack%20&%20Deploy%20Website/${RUN_ID}/${NAME}-build/${NAME}-curseforge-server.zip"
                 class="btn" target="_blank">↓ Download {{NAME}}-curseforge-server.zip</a>
            </div>

            <div class="card">
              <h2>pack.toml — For Server Installers</h2>
              <div class="link-box" style="background:#21262d; padding:16px; border-radius:8px; font-family:monospace; word-break:break-all;">
                https://raw.githubusercontent.com/ElectricDaFearox/Origins-TavernModpack/refs/heads/dev/pack.toml
              </div>
              <a href="https://raw.githubusercontent.com/ElectricDaFearox/Origins-TavernModpack/refs/heads/dev/pack.toml"
                 class="btn" target="_blank">↓ Download pack.toml</a>
              <p class="note">Use this with server installers, Pterodactyl, Docker, and other packwiz-based tools.</p>
            </div>

            <div class="card">
              <h2>index.toml</h2>
              <a href="https://raw.githubusercontent.com/ElectricDaFearox/Origins-TavernModpack/refs/heads/dev/index.toml"
                 class="btn" target="_blank">↓ Download index.toml</a>
            </div>

            <p style="text-align:center; color:#8b949e; margin-top:60px;">
              This page is automatically updated on every push to <strong>dev</strong>.<br>
              Large files are served via <strong>nightly.link</strong> (GitHub Artifacts).
            </p>
          </body>
          </html>
          EOF

          # Replace placeholders
          sed -i "s|{{NAME}}|$NAME|g" index.html
          sed -i "s|{{VERSION}}|${{ needs.build.outputs.version }}|g" index.html
          sed -i "s|{{DATE}}|$(date +'%b %d, %Y at %H:%M UTC')|g" index.html

          mkdir -p public
          mv index.html public/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
