name: Build Modpack

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go & Install packwiz
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Install packwiz and yq
        run: |
          go install github.com/packwiz/packwiz@latest
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Build Modpacks
        run: |
          RAW_NAME=$(yq '.name' pack.toml)
          CLEAN_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\{2,\}/-/g')

          # Export client .mrpack (includes client + both sides)
          ~/go/bin/packwiz mr export --output "${CLEAN_NAME}-client.mrpack"

          # Export server zip (includes server + both sides)
          ~/go/bin/packwiz server export --output "${CLEAN_NAME}-server.zip"

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-mrpack
          path: "*-client.mrpack"

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: "*-server.zip"
