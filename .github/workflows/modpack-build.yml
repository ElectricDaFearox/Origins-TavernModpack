name: Build Modpack & Deploy Website

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get modpack info
        id: info
        run: |
          VERSION=$(yq '.version' pack.toml | tr -d '"')
          NAME=$(yq '.name' pack.toml)
          CLEAN=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g')

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${CLEAN}" >> $GITHUB_OUTPUT
          echo "full_name=${NAME}" >> $GITHUB_OUTPUT

      - name: Build modpack
        run: |
          go install github.com/packwiz/packwiz@latest
          ~/go/bin/packwiz mr export --output "${{ steps.info.outputs.name }}.mrpack"

      - name: Prepare GitHub Pages
        run: |
          mkdir -p public

          cp pack.toml public/
          cp index.toml public/ 2>/dev/null || echo "No index.toml found"
          cp "${{ steps.info.outputs.name }}.mrpack" public/ || true

          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{{FULL_NAME}} - Modpack</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 30px;
                line-height: 1.6;
                color: #ddd;
                background: #0d1117;
              }
              h1 { color: #58a6ff; }
              .version { color: #8b949e; font-size: 1.1em; }
              .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 12px;
                padding: 24px;
                margin: 24px 0;
              }
              .btn {
                display: inline-block;
                background: #238636;
                color: white;
                padding: 14px 28px;
                border-radius: 8px;
                text-decoration: none;
                font-weight: 600;
                margin: 6px 10px 6px 0;
              }
              .btn:hover { background: #2ea44f; }
              .url-box {
                font-family: monospace;
                background: #21262d;
                padding: 12px;
                border-radius: 6px;
                word-break: break-all;
                margin: 10px 0;
                font-size: 0.95em;
              }
              .note { color: #f85149; font-size: 0.9em; }
              .success { color: #39d353; }
            </style>
          </head>
          <body>
            <h1>{{FULL_NAME}}</h1>
            <p class="version">Version {{VERSION}} • Updated {{DATE}}</p>

            <div class="card">
              <h2>Recommended Download (Prism / Modrinth)</h2>
              <a href="{{NAME}}.mrpack" class="btn">↓ Download {{NAME}}.mrpack</a>
              <p class="success">This is the best format for most users.</p>
            </div>

            <div class="card">
              <h2>Alternative: pack.toml / index.toml</h2>
              <p>These are mainly used by some server launchers or advanced users.</p>

              <p><strong>pack.toml</strong></p>
              <div class="url-box">https://electricdafearox.github.io/Origins-TavernModpack/pack.toml</div>
              <a href="pack.toml" class="btn">↓ Download pack.toml</a>

              <p style="margin-top: 20px;"><strong>index.toml</strong></p>
              <div class="url-box">https://electricdafearox.github.io/Origins-TavernModpack/index.toml</div>
              <a href="index.toml" class="btn">↓ Download index.toml</a>
            </div>

            <p style="color:#8b949e; text-align:center; margin-top:60px; font-size:0.9em;">
              This page is automatically generated on every push.
            </p>
          </body>
          </html>
          EOF

          sed -i "s|{{FULL_NAME}}|${{ steps.info.outputs.full_name }}|g" public/index.html
          sed -i "s|{{NAME}}|${{ steps.info.outputs.name }}|g" public/index.html
          sed -i "s|{{VERSION}}|${{ steps.info.outputs.version }}|g" public/index.html
          sed -i "s|{{DATE}}|$(date +'%b %d, %Y')|g" public/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
