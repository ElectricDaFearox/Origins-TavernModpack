name: Build Modpack & Deploy Website

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get modpack info
        id: info
        run: |
          VERSION=$(yq '.version' pack.toml | tr -d '"')
          NAME=$(yq '.name' pack.toml)
          CLEAN=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g')

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${CLEAN}" >> $GITHUB_OUTPUT
          echo "full_name=${NAME}" >> $GITHUB_OUTPUT

      - name: Build modpack
        run: |
          go install github.com/packwiz/packwiz@latest
          ~/go/bin/packwiz mr export --output "${{ steps.info.outputs.name }}.mrpack"

      - name: Prepare GitHub Pages
        run: |
          mkdir -p public

          # Copy both important files
          cp pack.toml public/
          cp index.toml public/ 2>/dev/null || echo "⚠️  index.toml not found - skipping"

          # Copy mrpack if it was created
          cp "${{ steps.info.outputs.name }}.mrpack" public/ || true

          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{{FULL_NAME}} - Modpack</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                max-width: 820px;
                margin: 40px auto;
                padding: 30px;
                line-height: 1.6;
                color: #ddd;
                background: #0d1117;
              }
              h1 { color: #58a6ff; }
              .version { color: #8b949e; }
              .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 12px;
                padding: 24px;
                margin: 24px 0;
              }
              .btn {
                display: inline-block;
                background: #238636;
                color: white;
                padding: 14px 24px;
                border-radius: 8px;
                text-decoration: none;
                font-weight: 600;
                margin: 8px 8px 8px 0;
              }
              .btn:hover { background: #2ea44f; }
              .direct-url {
                font-family: monospace;
                background: #21262d;
                padding: 12px;
                border-radius: 6px;
                word-break: break-all;
                margin: 12px 0;
                font-size: 0.95em;
              }
              .copy-hint { font-size: 0.85em; color: #8b949e; }
              .success { color: #39d353; }
            </style>
          </head>
          <body>
            <h1>{{FULL_NAME}}</h1>
            <p class="version">Version {{VERSION}} • Updated {{DATE}}</p>

            <div class="card">
              <h2>Direct Import Links</h2>
              <p class="success">✅ These links can be used directly in Prism Launcher or Modrinth App:</p>

              <p><strong>pack.toml</strong></p>
              <div class="direct-url">https://electricdafearox.github.io/Origins-TavernModpack/pack.toml</div>
              <a href="pack.toml" class="btn">↓ Download pack.toml</a>

              <p style="margin-top: 25px;"><strong>index.toml</strong></p>
              <div class="direct-url">https://electricdafearox.github.io/Origins-TavernModpack/index.toml</div>
              <a href="index.toml" class="btn">↓ Download index.toml</a>

              <p class="copy-hint">Right-click any link above → "Copy link address"</p>
            </div>

            <div class="card">
              <h2>Client Download</h2>
              <a href="{{NAME}}.mrpack" class="btn">↓ {{NAME}}.mrpack</a>
            </div>

            <p style="color:#8b949e; text-align:center; margin-top:60px; font-size:0.9em;">
              This site is automatically generated and updated on every push.
            </p>
          </body>
          </html>
          EOF

          sed -i "s|{{FULL_NAME}}|${{ steps.info.outputs.full_name }}|g" public/index.html
          sed -i "s|{{NAME}}|${{ steps.info.outputs.name }}|g" public/index.html
          sed -i "s|{{VERSION}}|${{ steps.info.outputs.version }}|g" public/index.html
          sed -i "s|{{DATE}}|$(date +'%b %d, %Y')|g" public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
