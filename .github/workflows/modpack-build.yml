name: Build Modpack & Deploy Website

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get modpack info
        id: info
        run: |
          VERSION=$(yq '.version' pack.toml | tr -d '"')
          NAME=$(yq '.name' pack.toml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Build modpack files
        run: |
          go install github.com/packwiz/packwiz@latest

          # Recommended .mrpack for clients (Prism + Modrinth)
          ~/go/bin/packwiz mr export --output "${{ steps.info.outputs.name }}.mrpack"

          # CurseForge Client
          ~/go/bin/packwiz curseforge export --output "${{ steps.info.outputs.name }}-curseforge-client.zip"

          # CurseForge Server - using --side server instead of --server
          ~/go/bin/packwiz curseforge export --side server --output "${{ steps.info.outputs.name }}-curseforge-server.zip"

      - name: Create website
        run: |
          mkdir -p public

          cp pack.toml public/
          cp index.toml public/ 2>/dev/null || true
          cp *.mrpack public/ 2>/dev/null || true
          cp *.zip public/ 2>/dev/null || true

          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{{NAME}} - Modpack</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                max-width: 1000px;
                margin: 40px auto;
                padding: 40px 20px;
                background: #0d1117;
                color: #ddd;
                line-height: 1.6;
              }
              h1 { color: #58a6ff; }
              .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 12px;
                padding: 24px;
                margin: 20px 0;
              }
              .link-box {
                font-family: monospace;
                background: #21262d;
                padding: 16px;
                border-radius: 8px;
                word-break: break-all;
                font-size: 1.05em;
                margin: 12px 0;
                color: #58a6ff;
              }
              .btn {
                background: #238636;
                color: white;
                padding: 14px 28px;
                border-radius: 8px;
                text-decoration: none;
                font-weight: bold;
                display: inline-block;
                margin: 10px 8px 10px 0;
              }
              .btn:hover { background: #2ea44f; }
              .btn-recommended {
                background: #3b82f6;
                font-size: 1.1em;
              }
              .btn-recommended:hover { background: #60a5fa; }
              .note { color: #8b949e; font-size: 0.95em; }
              .badge {
                display: inline-block;
                background: #238636;
                color: white;
                font-size: 0.75em;
                padding: 3px 10px;
                border-radius: 9999px;
                margin-left: 10px;
              }
              .server-tag {
                background: #f59e0b;
                color: #000;
                font-size: 0.8em;
                padding: 2px 9px;
                border-radius: 9999px;
              }
            </style>
          </head>
          <body>
            <h1>{{NAME}}</h1>
            <p class="note">Version {{VERSION}} • Updated {{DATE}}</p>

            <div class="card">
              <h2>Recommended — .mrpack <span class="badge">RECOMMENDED</span></h2>
              <p class="note">Best for <strong>Prism Launcher</strong> and <strong>Modrinth App</strong>.<br>Easy install + automatic updates.</p>
              <a href="{{NAME}}.mrpack" class="btn btn-recommended">↓ Download {{NAME}}.mrpack</a>
            </div>

            <div class="card">
              <h2>CurseForge Client</h2>
              <p class="note">For the CurseForge launcher (Client side).</p>
              <a href="{{NAME}}-curseforge-client.zip" class="btn">↓ Download {{NAME}}-curseforge-client.zip</a>
            </div>

            <div class="card">
              <h2>CurseForge Server <span class="server-tag">SERVER</span></h2>
              <p class="note">For the CurseForge launcher (Server side). Uses --side server.</p>
              <a href="{{NAME}}-curseforge-server.zip" class="btn">↓ Download {{NAME}}-curseforge-server.zip</a>
            </div>

            <div class="card">
              <h2>pack.toml — For Server Installers</h2>
              <div class="link-box">
                https://raw.githubusercontent.com/ElectricDaFearox/Origins-TavernModpack/refs/heads/dev/pack.toml
              </div>
              <a href="pack.toml" class="btn">↓ Download pack.toml</a>
              <p class="note">Recommended for server installers, Docker setups, Pterodactyl, and other server tools that support packwiz.</p>
            </div>

            <div class="card">
              <h2>index.toml</h2>
              <a href="index.toml" class="btn">↓ Download index.toml</a>
            </div>

            <p style="text-align:center; color:#8b949e; margin-top:60px;">
              This page is automatically updated when you push to the <strong>dev</strong> branch.
            </p>
          </body>
          </html>
          EOF

          sed -i "s|{{NAME}}|${{ steps.info.outputs.name }}|g" public/index.html
          sed -i "s|{{VERSION}}|${{ steps.info.outputs.version }}|g" public/index.html
          sed -i "s|{{DATE}}|$(date +'%b %d, %Y at %H:%M UTC')|g" public/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
