name: Build Modpack & Deploy Website

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get modpack info
        id: info
        run: |
          VERSION=$(yq '.version' pack.toml | tr -d '"')
          NAME=$(yq '.name' pack.toml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "artifact_name=${NAME}-build" >> $GITHUB_OUTPUT

      - name: Build modpack files
        run: |
          go install github.com/packwiz/packwiz@latest

          ~/go/bin/packwiz mr export --output "${{ steps.info.outputs.name }}.mrpack"
          ~/go/bin/packwiz curseforge export --output "${{ steps.info.outputs.name }}-curseforge-client.zip"
          ~/go/bin/packwiz curseforge export --side server --output "${{ steps.info.outputs.name }}-curseforge-server.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.artifact_name }}
          path: |
            *.mrpack
            *-curseforge-*.zip
            pack.toml
            index.toml
          retention-days: 90
          if-no-files-found: error

    outputs:
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      artifact_name: ${{ steps.info.outputs.artifact_name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: public

      - name: Create website
        run: |
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{{NAME}} - Modpack</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                max-width: 1000px;
                margin: 40px auto;
                padding: 40px 20px;
                background: #0d1117;
                color: #ddd;
                line-height: 1.6;
              }
              h1 { color: #58a6ff; }
              .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 12px;
                padding: 24px;
                margin: 20px 0;
              }
              .link-box {
                font-family: monospace;
                background: #21262d;
                padding: 16px;
                border-radius: 8px;
                word-break: break-all;
                font-size: 1.05em;
                margin: 12px 0;
                color: #58a6ff;
              }
              .btn {
                background: #238636;
                color: white;
                padding: 14px 28px;
                border-radius: 8px;
                text-decoration: none;
                font-weight: bold;
                display: inline-block;
                margin: 12px 8px 12px 0;
              }
              .btn:hover { background: #2ea44f; }
              .btn-recommended {
                background: #3b82f6;
                font-size: 1.1em;
              }
              .btn-recommended:hover { background: #60a5fa; }
              .note { color: #8b949e; font-size: 0.95em; }
              .badge {
                display: inline-block;
                background: #238636;
                color: white;
                font-size: 0.75em;
                padding: 3px 10px;
                border-radius: 9999px;
                margin-left: 10px;
              }
              .server-tag {
                background: #f59e0b;
                color: #000;
                font-size: 0.8em;
                padding: 2px 9px;
                border-radius: 9999px;
              }
              .warning {
                color: #f59e0b;
                font-size: 0.9em;
              }
            </style>
          </head>
          <body>
            <h1>{{NAME}}</h1>
            <p class="note">Version {{VERSION}} • Updated {{DATE}}</p>

            <div class="card">
              <h2>Recommended — .mrpack <span class="badge">RECOMMENDED</span></h2>
              <p class="note">Best for <strong>Prism Launcher</strong> and <strong>Modrinth App</strong>.<br>Easy install + automatic updates.</p>
              <a href="https://github.com/ElectricDaFearox/Origins-TavernModpack/actions/workflows/Build%20Modpack%20&%20Deploy%20Website.yml"
                 class="btn btn-recommended" target="_blank">↓ Download {{NAME}}.mrpack</a>
              <p class="warning">Note: Large files are hosted as GitHub Artifacts. You may need to be logged into GitHub to download.</p>
            </div>

            <div class="card">
              <h2>CurseForge Client</h2>
              <p class="note">For the CurseForge launcher (Client side).</p>
              <a href="https://github.com/ElectricDaFearox/Origins-TavernModpack/actions/workflows/Build%20Modpack%20&%20Deploy%20Website.yml"
                 class="btn" target="_blank">↓ Download {{NAME}}-curseforge-client.zip</a>
            </div>

            <div class="card">
              <h2>CurseForge Server <span class="server-tag">SERVER</span></h2>
              <p class="note">For the CurseForge launcher (Server side). pack.toml is intended for server installers.</p>
              <a href="https://github.com/ElectricDaFearox/Origins-TavernModpack/actions/workflows/Build%20Modpack%20&%20Deploy%20Website.yml"
                 class="btn" target="_blank">↓ Download {{NAME}}-curseforge-server.zip</a>
            </div>

            <div class="card">
              <h2>pack.toml — For Server Installers</h2>
              <div class="link-box">
                https://raw.githubusercontent.com/ElectricDaFearox/Origins-TavernModpack/refs/heads/dev/pack.toml
              </div>
              <a href="https://raw.githubusercontent.com/ElectricDaFearox/Origins-TavernModpack/refs/heads/dev/pack.toml"
                 class="btn" target="_blank">↓ Download pack.toml</a>
              <p class="note">Use this with server installers, Docker, Pterodactyl, and other packwiz-compatible server tools.</p>
            </div>

            <div class="card">
              <h2>index.toml</h2>
              <a href="https://raw.githubusercontent.com/ElectricDaFearox/Origins-TavernModpack/refs/heads/dev/index.toml"
                 class="btn" target="_blank">↓ Download index.toml</a>
            </div>

            <p style="text-align:center; color:#8b949e; margin-top:50px;">
              This page is automatically updated when you push to the <strong>dev</strong> branch.<br>
              <strong>All modpack files are now served via GitHub Artifacts due to repository size limits.</strong>
            </p>
          </body>
          </html>
          EOF

          sed -i "s|{{NAME}}|${{ needs.build.outputs.name }}|g" public/index.html
          sed -i "s|{{VERSION}}|${{ needs.build.outputs.version }}|g" public/index.html
          sed -i "s|{{DATE}}|$(date +'%b %d, %Y at %H:%M UTC')|g" public/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
